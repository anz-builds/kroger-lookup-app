# Build the desktop apps for Windows, macOS and Linux, then publish them as a GitHub release.
# Runs when a version tag (v1.2.3) is pushed; the tag must match electron/package.json's version.
name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: electron/dist/*.exe
          - os: macos-latest # Apple Silicon runner
            artifact: electron/dist/*.dmg
          - os: ubuntu-latest
            artifact: electron/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./electron/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match electron/package.json version $version"
            exit 1
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat < NUL

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First-launch help, shown above the auto-generated notes
          docs="https://github.com/$GITHUB_REPOSITORY/blob/default/docs/building.md"
          notes="> [!NOTE]
          > **macOS:** this build isn't notarized by Apple, so macOS 15 shows \"could not verify\" the first time you open it. To open it: [steps in docs/building.md]($docs#macos-apple-silicon).
          >
          > **Linux (Ubuntu 22.04+):** the AppImage needs FUSE 2. [See docs/building.md]($docs#linux-x64)."
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kroger Price Lookup ${GITHUB_REF_NAME#v}" \
            --notes "$notes" \
            --generate-notes
