[project]
name = "kroger-lookup-app"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.133.1",
    "starlette==1.10.0",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
